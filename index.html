<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>بيناتنا 💜</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7efff, #fff5fa);
      color: #4b3155;
      text-align: center;
      padding: 30px 15px;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 30px;
      box-shadow: 0 8px 30px #ddd;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>💜 بيناتنا</h1>

    <p>مكاننا الخاص 🌷</p>
<div id="auth">

  <h2>تسجيل الدخول 💜</h2>

  <input type="email" id="email" placeholder="الإيميل">

  <input type="password" id="password" placeholder="كلمة المرور">

  <input type="text" id="username" placeholder="اسم المستخدم">

  <button>إنشاء حساب</button>

  <button>تسجيل الدخول</button>
<div id="chat" style="display:none;">

  <h2>أهلًا بيچ 🌷</h2>

  <p>اختاري صديقتچ حتى تبدون المحادثة 💬</p>

  <div id="users"></div>

  <div id="messages"></div>

  <input
    type="text"
    id="message"
    placeholder="اكتبي رسالة..."
  >

  <button>إرسال 💜</button>

</div>
</div>
  </div>

</body>
    </html>
